<!DOCTYPE html>
<html lang="bn" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Django Chat{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <div class="nav-brand-icon">💬</div>
    NexaChat
  </div>
  <div class="nav-links">
    {% if user.is_authenticated %}
      <span class="nav-user">
        <div class="nav-avatar-sm">{{ user.username|first|upper }}</div>
        {{ user.username }}
      </span>
      <form method="POST" action="{% url 'logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm">Logout</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="btn btn-sm">Login</a>
      <a href="{% url 'register' %}" class="btn btn-sm btn-primary">Register</a>
    {% endif %}
  </div>
</nav>

{% block content %}{% endblock %}

{% block extra_js %}{% endblock %}
</body>
</html>
