{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Account তৈরি করো</h2>
    <form method="POST">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <span class="error">{{ field.errors.0 }}</span>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary w-full">Register</button>
    </form>
    <p class="auth-link">Account আছে? <a href="{% url 'login' %}">Login করো</a></p>
  </div>
</div>
{% endblock %}
