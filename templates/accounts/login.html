{% extends 'base.html' %}
{% block title %}Login — NexaChat{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">💬</div>
      <h2>NexaChat</h2>
    </div>
    <p class="auth-subtitle">Sign in to your account</p>
    <form method="POST">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <span class="error">{{ field.errors.0 }}</span>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary w-full" style="margin-top:8px;">Login →</button>
    </form>
    <p class="auth-link">No account? <a href="{% url 'register' %}">Register</a></p>
  </div>
</div>
{% endblock %}
